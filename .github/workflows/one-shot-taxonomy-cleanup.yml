name: One-shot LIBERO taxonomy cleanup

on:
  push:
    branches:
      - ui/webui-visual-refresh
    paths:
      - .github/workflows/one-shot-taxonomy-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/webui-visual-refresh
          fetch-depth: 0

      - name: Finish taxonomy cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          workflow = root / ".github/workflows/one-shot-taxonomy-cleanup.yml"
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")

          # Mechanical migration can produce doubled suite names in old prose.
          replacements = {
              "LIBERO-10 LIBERO-10": "LIBERO-10",
              "LIBERO-Spatial LIBERO-Spatial": "LIBERO-Spatial",
          }
          for name in tracked:
              if not name or name == str(workflow.relative_to(root)):
                  continue
              path = root / name
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")

          # The static HTML/legacy app still carried obsolete GPU-gate copy even
          # though the runtime shim already corrected it. Keep source and UI aligned.
          index = root / "tools/lf3r_annotator/static/index.html"
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              "Runs the existing OpenVLA natural generator. Render and record resolutions are independent square dimensions; the checkpoint policy input remains 224x224. GPU utilization is informational; the memory-only gate requires at least 30 GiB free and less than 50% used memory.",
              "Runs the existing OpenVLA generator. Render and record resolutions are independent square dimensions; policy preprocessing remains 224x224. GPU selection is user-managed; the WebUI does not block launches based on utilization or free memory.",
          )
          index.write_text(text, encoding="utf-8")

          app = root / "tools/lf3r_annotator/static/app.js"
          text = app.read_text(encoding="utf-8")
          text = text.replace(
              "GPU utilization is informational; the memory-only gate requires at least 30 GiB free and less than 50% used memory.",
              "GPU selection is user-managed; the WebUI does not block launch based on utilization or free memory.",
          )
          app.write_text(text, encoding="utf-8")

          # Update the one taxonomy-sensitive assertion that still expected the
          # old dataset-role implementation. LIBERO scopes are now task-suite filters.
          test_server = root / "tools/lf3r_annotator/tests/test_server.py"
          text = test_server.read_text(encoding="utf-8")
          text = text.replace(
              'self.assertIn("--dataset-role", job["command"])',
              'self.assertIn("--task-suite", job["command"])\n        self.assertIn("libero_10", job["command"])',
          )
          test_server.write_text(text, encoding="utf-8")

          # The temporary migration workflow must not remain in the repository.
          workflow.unlink()
          PY

      - name: Assert canonical taxonomy
        shell: bash
        run: |
          if git grep -n -I -E 'primary_natural|reference_natural|primary-natural|reference-natural|[Pp]rimary natural|[Rr]eference natural|LIBERO-10 LIBERO-10|LIBERO-Spatial LIBERO-Spatial' -- .; then
            echo 'Legacy or duplicated dataset taxonomy remains in tracked text files.' >&2
            exit 1
          fi
          if git grep -n -I -E 'All natural observations|Primary natural|Reference natural' -- tools/lf3r_annotator tools/baselines tools/safe_training; then
            echo 'Legacy user-facing scope wording remains.' >&2
            exit 1
          fi

      - name: Validate canonical scope contract
        shell: bash
        run: |
          PYTHONPATH=tools/lf3r_annotator python3 - <<'PY'
          import server
          assert server.RUN_SCOPES == ("all", "libero_10", "libero_spatial", "controlled_analysis")
          assert server.validate_run_scope(None) == "libero_10"
          assert server.record_matches_scope({"task_suite": "libero_10"}, "libero_10")
          assert server.record_matches_scope({"task_suite": "libero_spatial"}, "libero_spatial")
          assert server.record_matches_scope({"analysis_partition": "controlled_analysis"}, "controlled_analysis")
          PY
          grep -q -- '--task-suite' tools/baselines/run_lf3r_baseline.py
          grep -q 'dataset_role = "controlled_analysis" if source_kind == "controlled_injected" else suite' tools/lf3r_annotator/build_manifest.py

      - name: Static validation
        shell: bash
        run: |
          python3 -m py_compile \
            tools/lf3r_annotator/server.py \
            tools/lf3r_annotator/build_manifest.py \
            tools/lf3r_annotator/verify_pipeline.py \
            tools/baselines/run_lf3r_baseline.py \
            tools/safe_training/prepare_dataset.py \
            tools/prepare_libero10_instruction_variants.py
          node --check tools/lf3r_annotator/static/app.js
          node --check tools/lf3r_annotator/static/workspace-legacy.js
          node --check tools/lf3r_annotator/static/runs-layout.js
          node --check tools/lf3r_annotator/static/runs-semantics.js

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repo: finalize LIBERO dataset taxonomy'
          git push origin HEAD:ui/webui-visual-refresh
